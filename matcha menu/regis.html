<!DOCTYPE html>
<html>
    <head>
        <title>Matcha Feels</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <header>
        <h1>Matcha Feels</h1>
    </header>
    <body class="body5">
        <form action="external.html">
            <center>
            <h2>Registration</h2>
        </center>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" required><br>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br>
            <label for="birthday">Birthday</label><br>
            <input type="date" id="birthday" name="birthday" required><br>
            <label for="password">Create Password</label><br>
            <input type="password" id="password" name="password" placeholder="Enter a password" required><br>
            <label for="confirm-password">Confirm Password</label><br>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required><br><br>
            <center>
            <label for="gender">Sex:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
        </center>
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I agree to the terms and conditions</label><br>
            <center>
            <input type="submit" value="Register"><br><br>
            <p><small>Already have an account? <a href="external.html">Login now</a></small></p>
        </center>
        </form><br><br><br><br><br><br><br><br>
        <footer class="footer2">
            <p><small><b>Email:</b> javinalcristine@gmail.com<br><b>Contact Number:</b> 09123456789</small></p>
        </footer>
     </body>
</html>
